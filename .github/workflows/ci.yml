name: Ledger Rubric CI

on:
  push:
    branches: ["main", "1", "2", "3", "4", "feat/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-unit-and-race:
    name: Code Quality & Go Unit/Race Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Go vet
        run: go vet ./...

      - name: Go unit tests with race detector
        run: go test -v -race ./...

  live-stack-invariants:
    name: Deployment & Hard-Core Invariants (Levels 1-3)
    runs-on: ubuntu-latest
    needs: [go-unit-and-race]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start 2-replica stack via docker compose up
        env:
          ALLOW_SIMULATED_CLOCK: "true"
        run: |
          docker compose up -d --build
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/healthz; then
              echo ""
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: Run core & Level 1-3 live integration suites
        run: |
          pytest -v tests/test_person1_core.py tests/test_cards_loyalty_admin.py

      - name: Run standalone harness suite (when present)
        run: |
          if [ -d "harness" ] && ls harness/test_*.py >/dev/null 2>&1; then
            pytest -v harness/
          else
            echo "harness/ not yet merged on this branch; skipping harness run."
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  deliverables-check:
    name: Deliverables & Hygiene Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required deployment & documentation files
        run: |
          test -f docker-compose.yml
          test -f Dockerfile
          test -f README.md
          test -f migrations/001_init.sql
          if [ ! -f DESIGN.md ]; then
            echo "::warning::DESIGN.md (1-2 page design document) is not yet on this branch."
          fi

      - name: Check for accidentally committed GitHub tokens
        run: |
          if git grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' -- . ':!.github/workflows/ci.yml'; then
            echo "ERROR: Potential GitHub token found in tracked files!"
            exit 1
          fi
