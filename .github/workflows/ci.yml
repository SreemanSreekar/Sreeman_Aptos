name: Ledger Rubric CI

on:
  push:
    branches: ["main", "1", "2", "3", "4", "feat/**", "integration/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-unit-and-race:
    name: Code Quality & Go Unit/Race Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Check Go formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Staticcheck (dead code & static analysis)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
          staticcheck ./...

      - name: Go unit tests with race detector
        run: go test -v -race ./...

  live-stack-invariants:
    name: Deployment & Hard-Core Invariants (Levels 1-3)
    runs-on: ubuntu-latest
    needs: [go-unit-and-race]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start isolated 2-replica test stack
        run: |
          docker compose -p ci-acceptance -f docker-compose.test.yml up -d --build
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8081/healthz; then
              echo ""
              exit 0
            fi
            sleep 1
          done
          docker compose -p ci-acceptance -f docker-compose.test.yml logs
          exit 1

      - name: Run harness non-chaos live acceptance suites (Suites 2-7 + Unit)
        env:
          LEDGER_INTEGRATION: "1"
          LEDGER_P1_MERGED: "1"
          LEDGER_P2_MERGED: "1"
          LEDGER_BASE_URL: "http://localhost:8081"
          LEDGER_REPLICA1_URL: "http://localhost:8082"
          LEDGER_REPLICA2_URL: "http://localhost:8083"
          POSTGRES_HOST_PORT: "5434"
        run: |
          python -m pytest -v harness --ignore=harness/test_100k_chaos_replay.py

      - name: Run core & cards/loyalty/admin suites
        env:
          LEDGER_BASE_URL: "http://localhost:8081"
          POSTGRES_HOST_PORT: "5434"
        run: |
          python -m pytest -v tests/test_person1_core.py tests/test_cards_loyalty_admin.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose -p ci-acceptance -f docker-compose.test.yml logs --tail=200

      - name: Tear down test stack
        if: always()
        run: docker compose -p ci-acceptance -f docker-compose.test.yml down -v

  deliverables-check:
    name: Deliverables & Hygiene Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required deployment & documentation files
        run: |
          test -f docker-compose.yml
          test -f docker-compose.test.yml
          test -f Dockerfile
          test -f README.md
          test -f DESIGN.md
          test -f docs/design-submission.md
          test -f migrations/001_init.sql

      - name: Check for accidentally committed GitHub tokens
        run: |
          if git grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' -- . ':!.github/workflows/ci.yml'; then
            echo "ERROR: Potential GitHub token found in tracked files!"
            exit 1
          fi
